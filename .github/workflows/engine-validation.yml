name: Graphics Engine Validation

on:
  push:
    branches: [main]
    paths:
      - "engine.js"
      - "engine-systems.js"
      - "engine-assets.js"
      - "engine-showcase.js"
      - "game.js"
      - "game.html"
      - "game.css"
      - ".github/scripts/game-browser-test.mjs"
      - ".github/scripts/engine-systems.test.mjs"
      - ".github/scripts/engine-assets.test.mjs"
      - "engine.html"
      - "engine.css"
      - "city.html"
      - "city.css"
      - "city-world.js"
      - "city-lab.js"
      - ".github/scripts/city-world.test.mjs"
      - ".github/scripts/city-browser-test.mjs"
      - ".github/scripts/engine-browser-test.mjs"
      - ".github/workflows/engine-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine.js"
      - "engine-systems.js"
      - "engine-assets.js"
      - "engine-showcase.js"
      - "game.js"
      - "game.html"
      - "game.css"
      - ".github/scripts/game-browser-test.mjs"
      - ".github/scripts/engine-systems.test.mjs"
      - ".github/scripts/engine-assets.test.mjs"
      - "engine.html"
      - "engine.css"
      - "city.html"
      - "city.css"
      - "city-world.js"
      - "city-lab.js"
      - ".github/scripts/city-world.test.mjs"
      - ".github/scripts/city-browser-test.mjs"
      - ".github/scripts/engine-browser-test.mjs"
      - ".github/workflows/engine-validation.yml"

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript module syntax
        run: |
          node --check engine.js
          node --check game.js
      - name: Validate engine systems module syntax
        run: node --check engine-systems.js
      - name: Validate asset pipeline module syntax
        run: node --check engine-assets.js
      - name: Validate procedural showcase module syntax
        run: node --check engine-showcase.js
      - name: Validate browser test syntax
        run: node --check .github/scripts/engine-browser-test.mjs
      - name: Validate city modules and browser test syntax
        run: |
          node --check city-world.js
          node --check city-lab.js
          node --check .github/scripts/city-browser-test.mjs
      - name: Run engine and city data unit tests
        run: node --test .github/scripts/engine-systems.test.mjs .github/scripts/engine-assets.test.mjs .github/scripts/city-world.test.mjs
      - name: Validate engine page contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('engine.html', 'utf8');
          const js = readFileSync('engine.js', 'utf8');
          const requiredHtml = ['id="viewport"', 'id="time-of-day"', 'id="weather-mode"', 'id="reset-camera"', 'id="retry-renderer"', 'id="gpu-memory"', 'id="occlusion-count"', 'id="collision-pairs"', 'id="asset-pipeline-status"'];
          const requiredJs = ['WebGLRenderer', 'ACESFilmicToneMapping', 'PMREMGenerator', 'OrbitControls', 'OcclusionCuller', 'CollisionWorld', 'ResourceTracker', 'createThreeAssetPipeline', 'buildDhakaShowcase', 'function applyVisualPresets', 'function animate'];
          for (const token of requiredHtml) {
            if (!html.includes(token)) throw new Error('Missing HTML contract: ' + token);
          }
          for (const token of requiredJs) {
            if (!js.includes(token)) throw new Error('Missing engine contract: ' + token);
          }
          console.log('Graphics engine source and page contract checks passed.');
          NODE

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/banglar-alef-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/engine.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/banglar-alef-http.log
          exit 1
      - name: Run desktop and mobile-viewport WebGL acceptance tests
        run: node .github/scripts/engine-browser-test.mjs
      - name: Run OSM-to-3D city mobile acceptance test
        run: node .github/scripts/city-browser-test.mjs
      - name: Run first playable game acceptance test
        run: node .github/scripts/game-browser-test.mjs
